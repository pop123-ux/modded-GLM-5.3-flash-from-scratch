name: correctness-and-cpu-smoke
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/train_pretrain.py --config configs/tiny.json --output runs/ci-smoke --steps 2 --batch-size 2 --device cpu
      - run: python scripts/train_pretrain.py --config configs/tiny_research_bundle.json --output runs/ci-research-smoke --steps 2 --batch-size 2 --trim-padding --device cpu
